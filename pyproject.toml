[project]
name = "python"
version = "0.1.0"
description = "Generic Python environment, first installed Jan 9, 2025"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=5.5.0",
    "atproto>=0.0.65",
    "beautifulsoup4>=4.12.3",
    "datetime>=5.5",
    "decorator>=5.3.1",
    "dill>=0.3.9",
    "flask>=3.1.0",
    "jupyter>=1.1.1",
    "lxml>=5.3.0",
    "matplotlib>=3.10.0",
    "networkx>=3.4.2",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "pypdf>=5.3.1",
    "requests>=2.32.3",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "selenium>=4.30.0",
    "setuptools>=75.8.0",
    "sympy>=1.13.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

